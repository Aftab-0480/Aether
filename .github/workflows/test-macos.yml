
name: Test macOS CLI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cross-platform-cli

jobs:
  build-macos:
    name: macOS CLI Test
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test WebRTC dependency loading
        run: node -e "require('@roamhq/wrtc'); console.log('WebRTC loaded successfully')"

      - name: Build CLI
        run: npm run build -w agent

      - name: Run CLI self-test
        run: npm test -w agent

      - name: Install CLI globally
        run: npm install -g ./agent

      - name: Test global CLI help
        run: aether --help

      - name: Test global CLI version
        run: aether --version

      - name: Test global CLI self-test
        run: aether --self-test
