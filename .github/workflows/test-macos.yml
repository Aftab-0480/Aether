name: Test macOS CLI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cross-platform-cli

jobs:
  build-macos:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Locate native dependencies
        run: |
          echo "WebRTC native addons:"
          find node_modules/@roamhq -name "*.node" -print
          echo "node-pty native addons:"
          find node_modules/node-pty -name "*.node" -print

      - name: Test WebRTC dependency outside the executable
        run: node -e "require('@roamhq/wrtc'); console.log('WebRTC loaded successfully')"

      - name: Test PTY dependency outside the executable
        run: node -e "const pty = require('node-pty'); const child = pty.spawn('/bin/sh', ['-c', 'exit 0']); child.onExit(({ exitCode }) => { if (exitCode !== 0) process.exit(1); console.log('PTY spawned successfully'); });"

      - name: Build standalone CLI
        run: npm run build:exe -w agent

      - name: Check generated executable
        run: |
          ls -lah agent/binaries
          test -f agent/binaries/aether-cli-agent-macos
          chmod +x agent/binaries/aether-cli-agent-macos

      - name: Test CLI help
        run: ./agent/binaries/aether-cli-agent-macos --help

      - name: Test CLI version
        run: |
          output="$(./agent/binaries/aether-cli-agent-macos --version)"
          echo "$output"
          echo "$output" | grep -q "1.0.6"

      - name: Test CLI version
        run: |
          output="$(./agent/binaries/aether-cli-agent-macos --version)"
          echo "$output"
          echo "$output" | grep -q "1.0.6"

      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: aether-macos-intel
          path: agent/binaries/aether-cli-agent-macos
